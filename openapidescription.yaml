openapi: 3.0.0
info:
  title: EIS - Predictive Process Monitoring Microservice
  description: A machine learning-powered API for predicting remaining time and next activities in business processes
  version: 1.0.0
  contact:
    name: Benedikt Adler
  license:
    name: University of Vienna

servers:
  - url: http://localhost:8000
    description: Development server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Verify that the server is running and healthy
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /predict/remaining-time:
    post:
      summary: Predict remaining time
      description: Forecast how long a process case will take to complete using XGBoost model
      operationId: predictRemainingTime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
      responses:
        '200':
          description: Remaining time prediction successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Invalid request format
        '422':
          description: Validation error

  /predict/next_activity:
    post:
      summary: Predict next activity
      description: Predict the next activity in a process using LSTM neural network
      operationId: predictNextActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
      responses:
        '200':
          description: Next activity prediction successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Invalid request format
        '422':
          description: Validation error

  /predict/all:
    post:
      summary: Get all predictions
      description: Get combined predictions for remaining time and next activity
      operationId: predictAll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
      responses:
        '200':
          description: All predictions successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllPredictionsResponse'
        '400':
          description: Invalid request format
        '422':
          description: Validation error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for API authentication

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - healthy
          example: healthy

    PredictionRequest:
      type: object
      required:
        - case_id
        - prefix
      additionalProperties: false
      properties:
        case_id:
          type: string
          description: Unique identifier for the process case
          example: case_123
        prefix:
          type: array
          description: Array of activity names representing the process history
          items:
            type: string
          example:
            - activity_1
            - activity_2
            - activity_3

    PredictionResponse:
      type: object
      required:
        - prediction
        - confidence
        - timestamp
      properties:
        prediction:
          oneOf:
            - type: number
              description: Predicted remaining time in hours
            - type: string
              description: Predicted next activity name
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence score of the prediction
          example: 0.95
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 formatted timestamp of prediction
          example: 2026-06-01T12:30:00Z

    AllPredictionsResponse:
      type: object
      required:
        - remaining_time
        - next_activity
        - timestamp
      properties:
        remaining_time:
          $ref: '#/components/schemas/PredictionResponse'
        next_activity:
          $ref: '#/components/schemas/PredictionResponse'
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 formatted timestamp when all predictions were made
          example: 2026-06-01T12:30:00Z

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message describing what went wrong